[project]
name = "graphrag-system"
version = "0.1.0"
description = "Sistema GraphRAG con Neo4j y Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.5.3",
    "neo4j>=6.1.0",
    "ollama>=0.6.1",
    "langchain>=1.2.9",
    "langchain-community>=0.4.1",
    "sentence-transformers>=5.2.2",
    "tiktoken>=0.12.0",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "tqdm>=4.67.3",
    "pytest>=9.0.2",
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphrag"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a live Neo4j instance and Ollama server",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s  %(levelname)-8s  %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
